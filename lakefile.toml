name = "pak_stokes"
version = "0.1.0"
defaultTargets = ["PakStokes"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "PakStokes"
roots = ["PakStokes", "Laplace", "ActionSeparation", "CubeLinear", "CubicJump", "LaplaceProduct", "KernelAnalytic", "LaplaceDerivative", "CubicLateral", "CutContour", "DirectionalLaplace", "BorelTransfer", "CubicActions", "MixedActions"]
